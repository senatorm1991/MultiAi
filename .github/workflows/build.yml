name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
            if [ -z "$ZIP" ]; then echo "No Gradle project or zip file found"; exit 1; fi
            mkdir -p /tmp/proj
            unzip -q "$ZIP" -d /tmp/proj
            SETTINGS=$(find /tmp/proj -name settings.gradle.kts | head -1)
          fi
          cd "$(dirname "$SETTINGS")"
          for i in 1 2 3 4 5; do
            gradle assembleDebug --no-daemon && break
            echo "Attempt $i failed (likely 429 rate limit), waiting before retry..."
            sleep $((i * 60))
          done
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/MultiAI.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MultiAI-apk
          path: out/MultiAI.apk
