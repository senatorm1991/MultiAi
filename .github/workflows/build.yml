name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/MultiAI.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MultiAI-apk
          path: out/MultiAI.apk
